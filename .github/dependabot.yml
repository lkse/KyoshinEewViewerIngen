version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 * * *"
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
