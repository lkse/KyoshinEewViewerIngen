version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ReactiveUI.Avalonia 12.1.0 以降は ReactiveUI 24 / ReactiveUI.Primitives に移行しており、
      # 本アプリの System.Reactive ベースのコードと互換性がない（ビルドが壊れる）。12.1.0 未満に固定する。
      - dependency-name: "ReactiveUI.Avalonia"
        versions: [">=12.1.0"]
      # Splat 20 系は ReactiveUI 24 / Primitives と連動しており、ReactiveUI.Avalonia 12.0.3 は Splat 19.4.1 を要求する。
      # SplatVersion を 20 系に更新すると依存解決に失敗するため、20.0.0 未満に固定する。
      - dependency-name: "Splat"
        versions: [">=20.0.0"]
    groups:
      nuget:
        patterns:
          - "*"
