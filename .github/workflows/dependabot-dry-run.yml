name: dependabot-dry-run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run Dependabot dry-run (nuget)
        env:
          LOCAL_GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e LOCAL_GITHUB_ACCESS_TOKEN \
            -e ALLOW_DRY_RUN_STANDALONE=true \
            ghcr.io/dependabot/dependabot-updater-nuget:latest \
            bin/dry-run.rb nuget lkse/KyoshinEewViewerIngen
